---
openapi: 3.0.3
info:
  title: "tiger API"
  version: 2.0.1
paths:
  /bus/uk/citybus/locations:
    get:
      operationId: "listCityBusLocations"
      summary: "Get all available CityBus stops"
      x-mojo-name: "list_citybus_locations"
      x-mojo-to: "API::Bus::UK::CityBus::Locations#list"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "object"
          description: "CityBus Locations response"
  /bus/uk/citybus/services/{atco_id}:
    get:
      operationId: "getCityBusServices"
      parameters:
        - description: "Internal stop identifier"
          name: "atco_id"
          in: "path"
          required: true
          schema:
            type: "string"
      summary: "Get data from CityBus Services based on stop code"
      x-mojo-name: "get_citybus_services"
      x-mojo-to: "API::Bus::UK::CityBus::Services#get"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "object"
          description: "CityBus Services response"
  /bus/uk/citybus/services/{atco_id}/updates:
    get:
      operationId: "getCityBusServicesUpdates"
      parameters:
        - description: "Internal stop identifier"
          name: "atco_id"
          in: "path"
          required: true
          schema:
            type: "string"
      summary: "Get updates from CityBus Services based on stop code"
      x-mojo-name: "get_citybus_services_updates"
      x-mojo-to: "API::Bus::UK::CityBus::Services#updates"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "object"
          description: "CityBus Services Updates response"
  /hello_world:
    get:
      operationId: "getHelloWorld"
      summary: "Check the app uses to see if the API is running"
      x-mojo-name: "get_hello_world"
      x-mojo-to: "API::HelloWorld#list"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "object"
          description: "Hello World response"
  /rail/uk/locations:
    get:
      operationId: "listRailLocations"
      summary: "Get all available locations on the Tiger CIS"
      x-mojo-name: "list_rail_locations"
      x-mojo-to: "API::Rail::UK::Locations#list"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "array"
          description: "Tiger CIS Locations response"
  /rail/uk/services/{tiploc_id}:
    get:
      operationId: "getRailServices"
      parameters:
        - description: "Internal TIPLOC identifier"
          name: "tiploc_id"
          in: "path"
          required: true
          schema:
            type: "string"
      summary: "Get data from Tiger CIS Services based on TIPLOC code"
      x-mojo-name: "get_rail_services"
      x-mojo-to: "API::Rail::UK::Services#get"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "object"
          description: "Tiger CIS Services response"
servers:
- url: "/api/v1"

